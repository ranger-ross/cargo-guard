[package]
name = "cargo-guard"
description = "Cargo build script allow list"
version = "0.3.0"
edition = "2024"
authors = ["Ross Sullivan <rosssullivan101@gmail.com>"]
repository = "https://github.com/ranger-ross/cargo-guard.git"
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
readme = "README.md"
license = "MIT"
exclude = [".github/", "renovate.json", ".gitignore", "assets"]
[package.metadata.binstall]
# Archives ship the binary at the archive root (no leading dir).
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.23.1"
crossterm = { version = "0.29", features = ["osc52"] }
eyre = "0.6.14"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
similar = "3.2.0"
syntect = { version = "5", default-features = false, features = ["default-onig"] }
tempfile = "3"
toml = "1.1.8"
toml_edit = "0.25"
unicode-width = "0.2"
unicode-segmentation = "1"
cargo-config2 = "0.1.45"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
open = "5.4.4"
url = "2.5.8"
serde_json = "1.0.154"

[dev-dependencies]
portable-pty = "0.9.0"
vt100 = "0.18.1"
